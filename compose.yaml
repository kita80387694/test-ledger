name: test-ledger
services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: test_ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - ledger_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d test_ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  test-db:
    image: postgres:17
    profiles: [test]
    environment:
      POSTGRES_DB: test_ledger_test
      POSTGRES_USER: ledger_test
      POSTGRES_PASSWORD: ${TEST_POSTGRES_PASSWORD:?Copy .env.example to .env}
    ports:
      - "127.0.0.1:55433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger_test -d test_ledger_test"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://ledger:${POSTGRES_PASSWORD}@db:5432/test_ledger
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 20

volumes:
  ledger_data:
